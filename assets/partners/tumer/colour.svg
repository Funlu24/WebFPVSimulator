<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-labelledby="title">
  <title id="title">TÜMER Savunma ve Havacılık sponsor mark</title>
  <!-- Tümer Logo Icon: White square with internal origami arrow cutout -->
  <path fill="#ffffff" fill-rule="evenodd" d="M35 35h130v130H35z M54 51h94L100 145V78z"/>
  <!-- TÜMER Wordmark -->
  <text x="195" y="112" fill="#ffffff" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="2">TÜMER</text>
  <!-- Separator Line -->
  <path fill="#ffffff" d="M197 127h368v3H197z"/>
  <!-- Subtitle: SAVUNMA VE HAVACILIK -->
  <text x="198" y="157" fill="#ffffff" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="19" font-weight="700" textLength="366" lengthAdjust="spacing">SAVUNMA VE HAVACILIK</text>
  <!-- Türkiye & Flag Accent -->
  <g transform="translate(472, 172)">
