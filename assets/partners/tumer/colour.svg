    <circle cx="68" cy="10" r="5" fill="#ffffff"/>
    <circle cx="69.5" cy="10" r="4" fill="#e30a17"/>
    <polygon points="73,10 75,7 74,9.5 76.5,8.5 74.5,10.5 76.5,12 74,11 74.5,13.5 73,11.5" fill="#ffffff"/>
  </g>
</svg>
